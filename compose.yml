services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: valida
      POSTGRES_PASSWORD: valida
      POSTGRES_DB: valida
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valida -d valida"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 2026
      DATABASE_URL: postgres://valida:valida@postgres:5432/valida
      REDIS_URL: redis://redis:6379
      EXECUTION_MODE: distributed
      RUN_WORKER_IN_API: "true"
    ports:
      - "2026:2026"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ["bun", "src/worker.ts"]
    profiles: ["extra-workers"]
    environment:
      DATABASE_URL: postgres://valida:valida@postgres:5432/valida
      REDIS_URL: redis://redis:6379
      EXECUTION_MODE: distributed
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
